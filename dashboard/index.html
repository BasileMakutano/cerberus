<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerberus — Network Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <div class="logo-icon">⬡</div>
        <div>
          <div class="logo-name">Cerberus</div>
          <div class="logo-sub">network monitor</div>
        </div>
      </div>
      <div class="topbar-sep"></div>
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        System Status: <span id="statusText">Connecting…</span>
      </div>
      <div class="target-pill" id="targetPill">Target: —</div>
    </div>
    <div class="topbar-right">
      <span class="last-sync" id="lastSync">Last sync: —</span>
      <button class="icon-btn" title="Run Full Cycle" onclick="showView('pipeline')">▶</button>
      <button class="icon-btn" title="Settings" onclick="showView('settings')">⚙</button>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="nav-label">Navigation</div>
    <div class="nav-item active" id="nav-overview" onclick="showView('overview')">
      <span class="nav-icon">⊞</span> Overview
    </div>
    <div class="nav-item" id="nav-alerts" onclick="showView('alerts')">
      <span class="nav-icon">▲</span> Alerts
      <span class="nav-badge" id="sidebarBadge">0</span>
    </div>
    <div class="nav-item" id="nav-ports" onclick="showView('ports')">
      <span class="nav-icon">⬡</span> Ports
    </div>
    <div class="nav-item" id="nav-baselines" onclick="showView('baselines')">
      <span class="nav-icon">≈</span> Baselines
    </div>
    <div class="nav-item" id="nav-pipeline" onclick="showView('pipeline')">
      <span class="nav-icon">▶</span> Pipeline
    </div>
    <div class="nav-item" id="nav-cyclelog" onclick="showView('cyclelog')">
      <span class="nav-icon">↻</span> Cycle Log
    </div>
    <div class="nav-item" id="nav-settings" onclick="showView('settings')">
      <span class="nav-icon">≡</span> Settings
    </div>
    <div class="sidebar-footer">
      <div>ENGINE: <span id="sfEngine" style="color:var(--low)">Running</span></div>
      <div>DB: <span id="sfDb" style="color:var(--low)">Connected</span></div>
      <div id="sfCycle">CYCLE: —</div>
      <div id="sfModels">MODELS: —</div>
    </div>
  </nav>

  <!-- Views -->
  <main class="content" id="mainContent">
    <div id="view-overview"></div>
    <div id="view-alerts"   style="display:none"></div>
    <div id="view-ports"    style="display:none"></div>
    <div id="view-baselines" style="display:none"></div>
    <div id="view-pipeline" style="display:none"></div>
    <div id="view-cyclelog" style="display:none"></div>
    <div id="view-settings" style="display:none"></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
